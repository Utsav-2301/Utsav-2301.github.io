<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ]
    });">
  </script>

  <!-- Feed -->
  {% feed_meta %}
  {% seo %}
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="site-wrapper">
      <div class="header-inner">
        <a href="{{ '/' | relative_url }}" class="site-logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <!-- Neural network icon -->
              <circle cx="5" cy="7" r="1.8"/>
              <circle cx="5" cy="17" r="1.8"/>
              <circle cx="12" cy="4" r="1.8"/>
              <circle cx="12" cy="12" r="1.8"/>
              <circle cx="12" cy="20" r="1.8"/>
              <circle cx="19" cy="9" r="1.8"/>
              <circle cx="19" cy="15" r="1.8"/>
              <line x1="6.8" y1="7.5" x2="10.2" y2="5.5" stroke-width="1.2" stroke="currentColor" opacity="0.7"/>
              <line x1="6.8" y1="8.5" x2="10.2" y2="11" stroke-width="1.2" stroke="currentColor" opacity="0.7"/>
              <line x1="6.8" y1="16" x2="10.2" y2="13" stroke-width="1.2" stroke="currentColor" opacity="0.7"/>
              <line x1="6.8" y1="17" x2="10.2" y2="19" stroke-width="1.2" stroke="currentColor" opacity="0.7"/>
              <line x1="13.8" y1="4.5" x2="17.2" y2="8" stroke-width="1.2" stroke="currentColor" opacity="0.7"/>
              <line x1="13.8" y1="12" x2="17.2" y2="10" stroke-width="1.2" stroke="currentColor" opacity="0.7"/>
              <line x1="13.8" y1="12" x2="17.2" y2="14" stroke-width="1.2" stroke="currentColor" opacity="0.7"/>
              <line x1="13.8" y1="19.5" x2="17.2" y2="16" stroke-width="1.2" stroke="currentColor" opacity="0.7"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-title">{{ site.title }}</span>
            <span class="logo-tagline">{{ site.tagline }}</span>
          </div>
        </a>

        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
          <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}class="active"{% endif %}>Blog</a>
          <a href="{{ '/tags/' | relative_url }}" {% if page.url == '/tags/' %}class="active"{% endif %}>Tags</a>
          <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}class="active"{% endif %}>About</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- ===== CONTENT ===== -->
  <main>
    {{ content }}
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="site-wrapper">
      <div class="footer-inner">
        <span class="footer-copy">
          &copy; {{ 'now' | date: "%Y" }} {{ site.author.name }} &mdash; Built with Jekyll &amp; hosted on GitHub Pages
        </span>
        <nav class="footer-links">
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
          <a href="{{ '/tags/' | relative_url }}">Tags</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="/feed.xml">RSS</a>
          {% if site.author.github %}
          <a href="https://github.com/{{ site.author.github }}" target="_blank">GitHub ↗</a>
          {% endif %}
        </nav>
      </div>
    </div>
  </footer>

</body>
</html>
